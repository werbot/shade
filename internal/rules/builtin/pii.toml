# PII and numbers: phones, cards, addresses, identifiers. The general order of
# application is set by the order field, as in keys.toml and credentials.toml.
#
# All rules except phone and card are opt-in here: pasted paths and addresses
# break ordinary work with git log, stack traces and CODEOWNERS, so by
# default they are disabled and are enabled by the user.

[[rules]]
id = "phone" # a number with a country code: without a plus, versions and identifiers are left alone
type = "PHONE"
kind = "regex"
pattern = '''(?:^|[^\d+])(\+\d[\d\s().\-]{7,17}\d)(?:[^\d]|$)'''
secret_group = 1
validator = "phone"
keywords = ["+"]
order = 360

# The class [3-6] is not decoration: Luhn passes 0000000000000000 (the sum of zeros
# is divisible by 10), and it is the issuer class that cuts off both such strings and
# unix timestamps. It must not be lost in the port.
[[rules]]
id = "card" # card number: the issuer class plus the checksum
type = "CARD"
kind = "regex"
pattern = '''(?:^|[^\d.])([3-6](?:[ -]?\d){12,18})(?:[^\d.]|$)'''
secret_group = 1
validator = "luhn"
order = 370

[[rules]]
id = "email"
type = "EMAIL"
kind = "regex"
pattern = '''\b[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}\b'''
enabled = false
order = 380

[[rules]]
id = "ssn"
type = "SSN"
kind = "regex"
pattern = '''\b\d{3}-\d{2}-\d{4}\b'''
enabled = false
order = 390

[[rules]]
id = "iban"
type = "IBAN"
kind = "regex"
pattern = '''\b[A-Z]{2}\d{2}[A-Z0-9]{11,30}\b'''
enabled = false
order = 400

[[rules]]
id = "home_path" # only /home/ or /Users/ remains: the user name goes
type = "PATH"
kind = "regex"
pattern = '''/(?:home|Users)/([^/\s:"']+)'''
secret_group = 1
enabled = false
order = 410

[[rules]]
id = "mac_addr"
type = "MAC"
kind = "regex"
pattern = '''\b(?:[0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}\b'''
enabled = false
order = 420

# Six Python lookaheads for private ranges are replaced by the validator
# ip_global: private ranges, loopback and link-local are filtered out by parsing the address, not by
# not by the pattern.
[[rules]]
id = "public_ip"
type = "IP"
kind = "regex"
pattern = '''\b\d{1,3}(?:\.\d{1,3}){3}\b'''
validator = "ip_global"
enabled = false
order = 430

# As in the original: the pattern catches the form, and is_global decides the outcome. Documentation
# (2001:db8::/32) is considered global by Go, that is, the rule fires on it
# — the direction of the miss is over-masking, there is no leak.
[[rules]]
id = "public_ip6"
type = "IP"
kind = "regex"
pattern = '''(?:^|[^:.\w])([0-9A-Fa-f]{1,4}(?::[0-9A-Fa-f]{0,4}){2,7})(?:[^:.\w]|$)'''
secret_group = 1
validator = "ipv6_global"
enabled = false
order = 440

[[rules]]
id = "phone_loose" # a phone without a country code: article numbers and ticket ids have the same shape
type = "PHONE"
kind = "regex"
pattern = '''(?:^|[^\d\-.])((?:\(\d{3}\)[ .\-]?|\d{1,3}[ .\-])?\d{3}[ .\-]\d{2,3}[ .\-]\d{2,4})(?:[^\d\-.]|$)'''
secret_group = 1
enabled = false
order = 450
