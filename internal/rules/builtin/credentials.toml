# Credentials: HTTP headers, the command line, netrc and assignments.
# Continuation of the order numbering from keys.toml.
#
# Here are the rules that recognise a secret by the field name rather than by the format
# value, so the random_enough guard (see validate.go) decides whether to cut the
# value or whether it is ordinary code like `token: string`.

[[rules]]
id = "basic_auth" # Authorization: Basic lives in curl -v, in proxy logs, in MCP
type = "TOKEN"
kind = "regex"
pattern = '''(?i)Authorization:\s*Basic\s+([A-Za-z0-9+/=]{8,})'''
secret_group = 1
keywords = ["basic"]
order = 190

[[rules]]
id = "auth_header" # X-Api-Key, X-Auth-Token and related headers
type = "TOKEN"
kind = "regex"
pattern = '''(?i)(?:X-)?(?:Api|Auth|Access|Session)[-_](?:Key|Token|Secret)\s*:\s*([^\s"'`]{8,})'''
secret_group = 1
order = 200

[[rules]]
id = "cookie" # a cookie whose name contains session, sid, token, csrf or auth
type = "TOKEN"
kind = "regex"
pattern = '''(?i)(?:Set-)?Cookie:[^\n]*?\b\w*(?:session|sid|token|csrf|auth)\w*\s*=\s*([^;\s]{8,})'''
secret_group = 1
keywords = ["cookie"]
order = 210

[[rules]]
id = "netrc" # the password line from ~/.netrc
type = "SECRET"
kind = "regex"
pattern = '''(?i)machine\s+\S+(?:\s+(?:login|account)\s+\S+)?\s+password\s+([^\s"'`]+)'''
secret_group = 1
keywords = ["machine"]
order = 220

[[rules]]
id = "cli_userpass" # the password from -u admin:pass
type = "SECRET"
kind = "regex"
pattern = '''(?:-u|--user)\s+[^\s:]+:(\S+)'''
secret_group = 1
keywords = ["-u", "--user"]
order = 230

[[rules]]
id = "cli_password" # the value of --password=, --token= and related flags
type = "SECRET"
kind = "regex"
pattern = '''--(?:password|pass|token|api-key)[= ](\S{4,})'''
secret_group = 1
keywords = ["--"]
order = 240

[[rules]]
id = "query_param" # a parameter name in a query or urlencoded body, with -_. folding
type = "TOKEN"
kind = "regex"
pattern = '''(?i)[?&;](?:access[-_.]?token|refresh[-_.]?token|id[-_.]?token|auth[-_.]?token|token|api[-_.]?key|apikey|client[-_.]?secret|secret|password|passwd|pwd|signature|sig|code|x[-_.]?amz[-_.]?signature|x[-_.]?amz[-_.]?security[-_.]?token|x[-_.]?amz[-_.]?credential|x[-_.]?goog[-_.]?signature)=([^&#\s"'<>{}$]{4,})'''
secret_group = 1
order = 250

[[rules]]
id = "pw_command" # a password handed to a password-changing command: $PASS and short words are not secret
type = "SECRET"
kind = "regex"
pattern = '''\b(?:wgpw|htpasswd|chpasswd|smbpasswd|mkpasswd|openssl\s+passwd)[^\n'"]{0,60}['"]([^$'"\n][^'"\n]{3,})['"]'''
secret_group = 1
validator = "random_enough"
keywords = ["wgpw", "passwd"]
order = 260

[[rules]]
id = "bip39_seed" # wallet seed phrase: 12..24 short words under a field name
type = "SECRET"
kind = "regex"
pattern = '''(?i)(?:mnemonic|seed(?:\s+phrase)?|recovery(?:\s+phrase)?)\s*[:=]\s*((?:[a-z]{3,8}\s+){11,23}[a-z]{3,8})'''
secret_group = 1
keywords = ["mnemonic", "seed", "recovery"]
order = 270

# The Python guard (?![A-Z0-9_]*PUBLIC) cannot be expressed in RE2: there is no negative
# no negative lookahead. The deviation is deliberate and towards over-masking —
# `PUBLIC_KEY=...` the rule cuts it, there is no leak. See task-8-report.md.
[[rules]]
id = "env_secret" # an environment variable name in upper case
type = "SECRET"
kind = "regex"
pattern = '''\b(?:(?:[A-Z][A-Z0-9]*_)*(?:PASS|PASSWD|PWD|PASSPHRASE|CREDS|CREDENTIALS|SECRET|TOKEN|APIKEY|KEY|DSN|PAT)|PGPASSWORD|MYSQL_PWD|SECRET_KEY_BASE)[ \t]*=[ \t]*["']?([^\s"']{4,})'''
secret_group = 1
validator = "random_enough"
order = 280

[[rules]]
id = "secret_word" # two words that mean the same in any case
type = "SECRET"
kind = "regex"
pattern = '''(?i)\b(?:passphrase|credentials)\s*[:=]\s*["']?([A-Za-z0-9._\-/+]{6,})["']?'''
secret_group = 1
validator = "random_enough"
keywords = ["passphrase", "credentials"]
order = 290

# The tail of the pattern replaces the Python (?!\s*\(): a value followed by
# parenthesis, that is a function call (os.environ.get('X')), not a secret. Shortening
# the match up to the parenthesis is impossible: the character before the shortened value is always from
# the value class, and that is exactly what the guard forbids.
[[rules]]
id = "assignment" # key-value with a secret name
type = "SECRET"
kind = "regex"
pattern = '''(?:^|[^A-Za-z])(?:password|passwd|secret|api_key|apikey|access_key|private_key|privatekey|presharedkey|auth_key|auth_token|access_token|client_secret|token|psk|bearer)[ \t]*[:=][ \t]*["']?([A-Za-z0-9._\-/+]{6,})["']?(?:[^A-Za-z0-9._\-/+(]|$)'''
secret_group = 1
validator = "random_enough"
order = 300

# The backreference (?P=q) to the key quote is expanded into an alternation over the names
# keys, and (?P=q2) on the value quote — into a single class without quotes: a string with
# different quotes does not occur in the source, and a miss in this direction only
# widens the match.
[[rules]]
id = "py_repr" # repr, dict literal and JSON: a quoted value after a secret key
type = "SECRET"
kind = "regex"
pattern = '''(?:^|[^A-Za-z])(?:"(?:password|passwd|secret|api_key|apikey|access_key|private_key|privatekey|presharedkey|auth_key|auth_token|access_token|client_secret|token|psk|bearer)"|'(?:password|passwd|secret|api_key|apikey|access_key|private_key|privatekey|presharedkey|auth_key|auth_token|access_token|client_secret|token|psk|bearer)'|(?:password|passwd|secret|api_key|apikey|access_key|private_key|privatekey|presharedkey|auth_key|auth_token|access_token|client_secret|token|psk|bearer))[ \t]*[:=][ \t]*["']([^"'\\\n$%<{\[][^"'\\\n]{3,199})["']'''
secret_group = 1
validator = "random_enough"
order = 310

[[rules]]
id = "pytest_where" # pytest prints where the value came from
type = "SECRET"
kind = "regex"
pattern = '''\bwhere\s+["']([^"'\\\n]{4,200})["']\s*=\s*[\w.()\[\]"']*?(?:password|passwd|secret|api_key|apikey|access_key|private_key|privatekey|presharedkey|auth_key|auth_token|access_token|client_secret|token|psk|bearer)\b'''
secret_group = 1
validator = "random_enough"
keywords = ["where"]
order = 320

[[rules]]
id = "prefix" # vendor token prefixes: the prefix itself stays visible
type = "TOKEN"
kind = "regex"
pattern = '''(?i)(?:dckr_pat_|tok_|sk-|ghp_|gho_|github_pat_|AKIA|hf_|xoxb-|xoxp-|Bearer\s+|SG\.|npm_|pypi-|hvs\.|hvb\.|glpat-|gldt-|xapp-|key-|re_|whsec_|pat_v\d+\.)([A-Za-z0-9_\-.]{8,})'''
secret_group = 1
validator = "random_enough"
order = 330

[[rules]]
id = "conn_str" # the password in a connection URL: the user name and the scheme stay
type = "DSN"
kind = "regex"
pattern = '''[a-z][a-z0-9+.\-]*://[^\s/:@]+:([^\s/@]+)@'''
secret_group = 1
keywords = ["://"]
order = 340

[[rules]]
id = "jwt"
type = "TOKEN"
kind = "regex"
pattern = '''eyJ[A-Za-z0-9_\-]{10,}\.eyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}'''
keywords = ["eyj"]
order = 350

# Replacement for the five Python lookbehinds (?<!h1)(?<!md5)(?<!sha1)(?<!sha256)(?<!sha512):
# the last character of each label is a digit, so «not a digit before [: =]» cuts them off.
# It narrows the rule (key1=... is skipped too); entropy is disabled by default and
# deliberately incomplete, so the direction of the miss is chosen towards a skip.
[[rules]]
id = "entropy" # the entropy of a value in an assignment: a noisy rule, opt-in
type = "SECRET"
kind = "entropy"
pattern = '''(?:^|[^0-9])(?:[:=]\s*["']?)([A-Za-z0-9+/_\-]{16,128})'''
secret_group = 1
entropy_min = 3.5
allowlist = ['(?i)^[0-9a-f]{7,64}$', '(?i)^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$', '^[\d._\-]+$', '(?i)^v?\d[\w.\-+]*$']
enabled = false
order = 460
